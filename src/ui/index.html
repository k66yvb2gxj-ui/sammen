<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Hovedmeny">
      <a class="brand" href="#overview" aria-label="Sammen, oversikt"><span class="brand-mark">s<span></span></span><span>sammen<span class="brand-period">.</span></span></a>

      <div id="project-navigation" class="project-navigation"></div>

      </div>
    </div>
