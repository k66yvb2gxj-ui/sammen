name: Prepare release from an existing build

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Windows build run ID (digits only)
        required: true
        type: string
      tag:
        description: Stable version tag, for example v0.4.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-existing-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the source build and draft
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sammen-release-existing-build.py" <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import sys

          WORKFLOW_PATH = ".github/workflows/windows-release.yml"
          CONTEXT = Path(os.environ["RUNNER_TEMP"]) / "sammen-release-existing-build.json"

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def api(method, endpoint, payload=None, missing=False):
              args = ["gh", "api", "--include", "--method", method,
                      "-H", "Accept: application/vnd.github+json", endpoint]
              if payload is not None:
                  args += ["--input", "-"]
              result = subprocess.run(args, input=None if payload is None else json.dumps(payload),
                                      capture_output=True, text=True, timeout=90)
              match = re.match(r"HTTP/[\d.]+\s+(\d{3})\b", result.stdout)
              require(match is not None, f"GitHub network/transport failure during {method} {endpoint}.")
              status = int(match.group(1))
              if status == 404 and missing:
                  return None
              require(result.returncode == 0 and 200 <= status < 300,
                      f"GitHub returned HTTP {status} during {method} {endpoint}; no fallback mutation was attempted.")
              _, separator, body = result.stdout.partition("\n\n")
              require(bool(separator), "GitHub response headers were incomplete.")
              return json.loads(body)

          def pages(endpoint, key=None):
              result = []
              for page in range(1, 101):
                  separator = "&" if "?" in endpoint else "?"
                  response = api("GET", f"{endpoint}{separator}per_page=100&page={page}")
                  items = response if key is None else response[key]
                  require(isinstance(items, list), "Unexpected paginated GitHub response.")
                  result.extend(items)
                  if len(items) < 100:
                      return result
              raise RuntimeError("GitHub pagination limit exceeded.")

          def find_release(repo, tag):
              release = api("GET", f"repos/{repo}/releases/tags/{tag}", missing=True)
              if release is not None:
                  return release
              # Authenticated release listings also include drafts, even when
              # the lookup by tag does not return an unpublished release.
              matches = [item for item in pages(f"repos/{repo}/releases") if item["tag_name"] == tag]
              require(len(matches) <= 1, "More than one release has the requested tag.")
              return matches[0] if matches else None

          def draft(release, tag):
              require(release["tag_name"] == tag, "Release tag changed.")
              require(release.get("draft") is True, "The release is already published; no assets will be changed.")
              require(release.get("prerelease") is False, "The requested stable release is marked as a prerelease.")
              require(type(release.get("id")) is int and release["id"] > 0, "Invalid release ID.")

          def check_tag(repo, tag, head):
              ref = api("GET", f"repos/{repo}/git/ref/tags/{tag}", missing=True)
              if ref is None:
                  return
              obj, visited = ref["object"], set()
              while obj["type"] == "tag":
                  require(obj["sha"] not in visited and len(visited) < 8, "Invalid annotated tag chain.")
                  visited.add(obj["sha"])
                  obj = api("GET", f"repos/{repo}/git/tags/{obj['sha']}")["object"]
              require(obj["type"] == "commit" and obj["sha"] == head,
                      "The existing Git tag points to another commit; it will not be moved.")

          def validate_source():
              repo, run_id, tag = (os.environ[name] for name in ("GH_REPO", "SOURCE_RUN_ID", "RELEASE_TAG"))
              require(re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo), "Invalid repository.")
              require(re.fullmatch(r"[1-9]\d{0,19}", run_id), "source_run_id must contain digits only.")
              require(re.fullmatch(r"v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", tag),
                      "The tag must be a stable vX.Y.Z version.")
              run = api("GET", f"repos/{repo}/actions/runs/{run_id}")
              require(run["id"] == int(run_id) and run["repository"]["full_name"] == repo
                      and run["head_repository"]["full_name"] == repo, "The build must belong to this repository.")
              require(run["status"] == "completed" and run["conclusion"] == "success", "The source build did not succeed.")
              head = run["head_sha"]
              require(re.fullmatch(r"[0-9a-f]{40}", head), "The build must identify a full commit SHA.")
              require(run["path"] == WORKFLOW_PATH, "Unexpected source workflow path.")
              workflow = api("GET", f"repos/{repo}/actions/workflows/{run['workflow_id']}")
              require(workflow["path"] == WORKFLOW_PATH, "Source workflow metadata does not match.")
              package = api("GET", f"repos/{repo}/contents/package.json?ref={head}")
              require(package["type"] == "file" and package["encoding"] == "base64", "Invalid source package metadata.")
              decoded = base64.b64decode(re.sub(r"\s+", "", package["content"]), validate=True)
              version = json.loads(decoded)["version"]
              require(version == tag[1:], "package.json at the build commit does not match the requested tag.")
              attempt = run["run_attempt"]
              require(type(attempt) is int and attempt > 0, "Invalid source run attempt.")
              artifact_name = f"sammen-windows-{run_id}-{attempt}"
              matches = [item for item in pages(f"repos/{repo}/actions/runs/{run_id}/artifacts", "artifacts")
                         if item["name"] == artifact_name]
              require(len(matches) == 1, "Expected exactly one Windows artifact for the successful run attempt.")
              artifact = matches[0]
              require(artifact.get("expired") is False and artifact["size_in_bytes"] > 0, "The build artifact is expired or empty.")
              require(type(artifact["id"]) is int and artifact["id"] > 0, "Invalid artifact ID.")
              require(artifact["workflow_run"]["id"] == int(run_id)
                      and artifact["workflow_run"]["head_sha"] == head, "Artifact provenance does not match the build.")
              require(re.fullmatch(r"sha256:[0-9a-f]{64}", artifact.get("digest", "")), "Artifact SHA-256 metadata is missing.")
              release = find_release(repo, tag)
              if release is not None:
                  draft(release, tag)
              check_tag(repo, tag, head)
              context = {"repo": repo, "run_id": run_id, "head": head, "tag": tag, "version": version,
                         "artifact_id": str(artifact["id"]), "artifact_name": artifact_name,
                         "artifact_digest": artifact["digest"]}
              CONTEXT.write_text(json.dumps(context), encoding="utf-8")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  for key in ("artifact_id", "artifact_name", "run_id", "head"):
                      output.write(f"{key}={context[key]}\n")
              print(f"Validated successful run {run_id}, commit {head}, artifact {artifact_name}.")

          def file_hash(path, algorithm):
              result = hashlib.new(algorithm)
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      result.update(chunk)
              return result

          def scalar(value):
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  return value[1:-1]
              return value

          def verify_files(context, directory):
              installer = f"Sammen-Windows-{context['version']}.exe"
              expected = {installer, f"Sammen-Windows-{context['version']}.zip", installer + ".blockmap",
                          "latest.yml", "SHA256SUMS.txt"}
              entries = list(directory.iterdir())
              names = {item.name for item in entries}
              require(names in (expected, expected | {"builder-debug.yml"})
                      and all(item.is_file() and not item.is_symlink() and item.stat().st_size > 0 for item in entries),
                      "Artifact must contain the five release files, plus only the optional builder-debug.yml.")
              print("Artifact files: " + ", ".join(sorted(names)))
              checksums = {}
              for line in (directory / "SHA256SUMS.txt").read_text(encoding="utf-8-sig").splitlines():
                  if not line.strip():
                      continue
                  match = re.fullmatch(r"([0-9A-Fa-f]{64}) [ *](.+)", line)
                  require(match is not None and match[2] not in checksums, "Invalid or duplicate SHA-256 checksum entry.")
                  checksums[match[2]] = match[1].lower()
              require(set(checksums) == names - {"SHA256SUMS.txt"}, "Checksum file names do not match the artifact files.")
              for name, checksum in checksums.items():
                  require(file_hash(directory / name, "sha256").hexdigest() == checksum, f"SHA-256 mismatch: {name}.")
              metadata = (directory / "latest.yml").read_text(encoding="utf-8-sig")
              def top(key):
                  values = re.findall(r"^" + key + r":[ \t]*([^\r\n]+)$", metadata, re.MULTILINE)
                  require(len(values) == 1, f"Expected one top-level {key} in latest.yml.")
                  return scalar(values[0])
              require(top("version") == context["version"] and top("path") == installer,
                      "latest.yml does not identify the expected version and installer.")
              expected_sha512 = base64.b64decode(top("sha512"), validate=True)
              require(len(expected_sha512) == 64 and file_hash(directory / installer, "sha512").digest() == expected_sha512,
                      "Installer SHA-512 does not match latest.yml.")
              block = re.search(r"^files:[ \t]*\r?\n((?:[ \t]+[^\r\n]*(?:\r?\n|$))*)", metadata, re.MULTILINE)
              require(block is not None, "latest.yml is missing its installer files entry.")
              lines = [line for line in block[1].splitlines() if line.strip()]
              values = {}
              for line in lines:
                  match = re.fullmatch(r"[ \t]+(?:- )?(url|sha512|size|blockMapSize):[ \t]*(.+)", line)
                  require(match is not None and match[1] not in values, "Unsupported or duplicate latest.yml files entry.")
                  values[match[1]] = scalar(match[2])
              require(set(values) in ({"url", "sha512", "size"}, {"url", "sha512", "size", "blockMapSize"}),
                      "latest.yml must contain exactly one installer entry.")
              require(values["url"] == installer and values["sha512"] == top("sha512")
                      and values["size"].isdigit() and int(values["size"]) == (directory / installer).stat().st_size,
                      "latest.yml files entry does not match the verified installer.")
              return {"names": sorted(expected), "checksums": checksums,
                      "source_manifest_sha256": file_hash(directory / "SHA256SUMS.txt", "sha256").hexdigest(),
                      "debug_sha256": checksums.get("builder-debug.yml")}

          def stage_public_files(context, source, verified):
              directory = source.parent / "public-release-assets"
              directory.mkdir(exist_ok=False)
              for name in verified["names"]:
                  if name != "SHA256SUMS.txt":
                      shutil.copyfile(source / name, directory / name)
              # Keep the original artifact and manifest untouched. The public
              # manifest covers only the four payload files that are released.
              public_manifest = "".join(f"{verified['checksums'][name]}  {name}\n"
                                        for name in verified["names"] if name != "SHA256SUMS.txt")
              (directory / "SHA256SUMS.txt").write_text(public_manifest, encoding="utf-8")
              files = {name: {"size": (directory / name).stat().st_size,
                              "sha256": file_hash(directory / name, "sha256").hexdigest()}
                       for name in verified["names"]}
              summary = (f"## Draft release provenance\n\n"
                         f"- Source run: https://github.com/{context['repo']}/actions/runs/{context['run_id']}\n"
                         f"- Build commit: `{context['head']}`\n"
                         f"- Artifact: `{context['artifact_name']}` (ID `{context['artifact_id']}`)\n"
                         f"- Artifact digest: `{context['artifact_digest']}`\n"
                         f"- Original SHA256SUMS.txt SHA-256: `{verified['source_manifest_sha256']}`\n"
                         f"- Public SHA256SUMS.txt SHA-256: `{files['SHA256SUMS.txt']['sha256']}`\n"
                         f"- Public checksums retain the original hashes of all four released payload files.\n")
              if verified["debug_sha256"]:
                  summary += (f"- builder-debug.yml was verified with SHA-256 `{verified['debug_sha256']}` "
                              "and excluded from public assets and the public checksum manifest.\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write(summary + "\n")
              print(summary)
              return directory, files

          def prepare_draft():
              context = json.loads(CONTEXT.read_text(encoding="utf-8"))
              require(context["repo"] == os.environ["GH_REPO"] and context["run_id"] == os.environ["SOURCE_RUN_ID"]
                      and context["tag"] == os.environ["RELEASE_TAG"], "Validated release context changed.")
              directory = Path(os.environ["GITHUB_WORKSPACE"]) / "release-assets"
              verified = verify_files(context, directory)
              directory, files = stage_public_files(context, directory, verified)
              repo, tag, head = (context[key] for key in ("repo", "tag", "head"))
              check_tag(repo, tag, head)
              release = find_release(repo, tag)
              if release is None:
                  release = api("POST", f"repos/{repo}/releases", {"tag_name": tag, "target_commitish": head,
                                "name": f"Sammen {tag}", "draft": True, "prerelease": False})
              draft(release, tag)
              release_id = release["id"]
              title, notes = release.get("name"), release.get("body")
              if release["target_commitish"] != head:
                  release = api("PATCH", f"repos/{repo}/releases/{release_id}", {"target_commitish": head, "tag_name": tag})
              draft(release, tag)
              require(release["target_commitish"] == head and release.get("name") == title and release.get("body") == notes,
                      "Draft target, title or notes do not match the expected state.")
              for name in files:
                  current = api("GET", f"repos/{repo}/releases/{release_id}")
                  draft(current, tag)
                  require(current["target_commitish"] == head, "Draft target changed before asset upload.")
                  result = subprocess.run(["gh", "release", "upload", tag, str(directory / name),
                                           "--clobber", "--repo", repo], capture_output=True, text=True, timeout=600)
                  require(result.returncode == 0, f"Asset upload failed: {name}; the release remains a draft.")
                  print(f"Uploaded {name} ({files[name]['size']} bytes).")
              current = api("GET", f"repos/{repo}/releases/{release_id}")
              draft(current, tag)
              require(current["target_commitish"] == head and current.get("name") == title and current.get("body") == notes,
                      "Draft metadata changed during preparation.")
              assets = pages(f"repos/{repo}/releases/{release_id}/assets")
              for name, metadata in files.items():
                  matches = [item for item in assets if item["name"] == name]
                  require(len(matches) == 1 and matches[0]["state"] == "uploaded" and matches[0]["size"] == metadata["size"]
                          and matches[0].get("digest") == "sha256:" + metadata["sha256"],
                          f"Uploaded asset verification failed: {name}.")
              print(f"Draft {tag} is ready with five verified assets from {head}. It has NOT been published.")

          if __name__ == "__main__":
              try:
                  if sys.argv[1] == "validate":
                      validate_source()
                  elif sys.argv[1] == "prepare":
                      prepare_draft()
                  else:
                      raise RuntimeError("Unknown release preparation stage.")
              except Exception as error:
                  print(f"::error::{error}", file=sys.stderr)
                  sys.exit(1)
          PY
          python "$RUNNER_TEMP/sammen-release-existing-build.py" validate

      - name: Download the validated immutable artifact inside GitHub
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: release-assets
          digest-mismatch: error

      - name: Verify files and prepare the draft without publishing
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/sammen-release-existing-build.py" prepare
